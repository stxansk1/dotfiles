include ./style.conf

confirm_os_window_close 0

# ---------------------------------------------------------------
# Прозрачность
# ---------------------------------------------------------------
# 1.0 = непрозрачное, меньше = прозрачнее (было 0.92)
background_opacity         0.95

# Разрешает менять прозрачность на лету
dynamic_background_opacity yes

# Ctrl+Alt+=  менее прозрачное (+0.05)
map ctrl+alt+equal         set_background_opacity +0.05
# Ctrl+Alt+-  более прозрачное (-0.05)
map ctrl+alt+minus         set_background_opacity -0.05
# Ctrl+Alt+1  полностью непрозрачное
map ctrl+alt+1             set_background_opacity 1
# Ctrl+Alt+0  вернуть значение из конфига
map ctrl+alt+0             set_background_opacity default

# ---------------------------------------------------------------
# Шрифт и внешний вид
# ---------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
font_size        14
bold_font        auto
italic_font      auto
bold_italic_font auto

mouse_hide_wait  3.0
cursor_shape     block
# url_color      #00FFFF
url_style        dashed

# ---------------------------------------------------------------
# Дополнительно
# ---------------------------------------------------------------
window_padding_width 8
scrollback_lines     10000
enable_audio_bell    no

# BEGIN_KITTY_THEME
# Argonaut
include current-theme.conf
# END_KITTY_THEME
