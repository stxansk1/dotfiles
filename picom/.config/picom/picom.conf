# Рендеринг через GPU
backend = "glx";
vsync = true;
use-damage = true;

# Отключаем то, что не используешь
shadow = false;
fading = false;

# Настройки размытия (Классический метод)
blur: {
  method = "gaussian";
  size = 10;
  deviation = 5.0;
}

# Исключения для размытия
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];


